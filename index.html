<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voyage 2026 - International Conference</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    colors: { brand: { navy: '#0f172a', blue: '#1e3a8a', gold: '#b49b67', light: '#f8fafc' } }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; }
        
        .hero-bg {
            /* 이미지가 없으면 기본 색상이 나오도록 수정 */
            background-image: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.8)), url('msc.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0f172a; /* Fallback color */
        }

        /* 페이지 섹션 애니메이션 */
        .page-section { display: none; opacity: 0; transform: translateY(10px); transition: all 0.4s ease-out; }
        .page-section.active { display: block; opacity: 1; transform: translateY(0); }
        
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-left-color: #ffffff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        .spinner-dark { border: 3px solid rgba(0,0,0,0.1); border-left-color: #b49b67; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .modal-backdrop { background-color: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); z-index: 9999; }
        
        .status-badge { @apply text-xs font-bold px-2 py-1 rounded inline-block text-center min-w-[80px]; }
        .status-Under_Review { @apply bg-yellow-100 text-yellow-800; }
        .status-Accepted { @apply bg-green-100 text-green-800; }
        .status-Rejected { @apply bg-red-100 text-red-800; }
    </style>
</head>
<body class="bg-brand-light text-slate-700 flex flex-col min-h-screen">

    <div class="bg-brand-navy text-slate-400 text-xs py-2 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <span class="hidden sm:inline">The 1st International Conference on AI Convergence & Future Maritime</span>
            <span class="sm:hidden">AI Voyage 2026</span>
            <div class="flex items-center gap-4" id="auth-menu">
                <button onclick="openModal('login-modal')" class="hover:text-white transition">Login</button>
                <span>|</span>
                <button onclick="openModal('signup-modal')" class="hover:text-white transition">Sign Up</button>
            </div>
        </div>
    </div>

    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="showSection('home')">
                <div class="p-2 bg-brand-navy rounded text-brand-gold group-hover:bg-brand-blue transition duration-300">
                    <i data-lucide="anchor" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-brand-navy leading-none tracking-tight">AI Voyage 2026</h1>
                    <p class="text-[10px] text-slate-500 font-bold tracking-widest uppercase mt-1">Shanghai - Okinawa</p>
                </div>
            </div>

            <nav class="hidden lg:flex gap-8 text-sm font-medium text-slate-600" id="desktop-nav">
                <button onclick="showSection('home')" class="nav-link active hover:text-brand-blue transition border-b-2 border-brand-blue">Home</button>
                <button onclick="showSection('about')" class="nav-link hover:text-brand-blue transition border-b-2 border-transparent">Overview</button>
                <button onclick="showSection('program')" class="nav-link hover:text-brand-blue transition border-b-2 border-transparent">Program</button>
                <button onclick="showSection('submission')" class="nav-link hover:text-brand-blue transition border-b-2 border-transparent">Submission</button>
                <button onclick="showSection('venue')" class="nav-link hover:text-brand-blue transition border-b-2 border-transparent">Venue</button>
                <button onclick="showSection('accommodation')" class="nav-link hover:text-brand-blue transition border-b-2 border-transparent">Accommodation</button>
                <button onclick="showSection('admin'); loadAdminData()" id="nav-admin-btn" class="hidden text-red-600 font-bold hover:text-red-800 transition bg-red-50 px-3 py-1 rounded-full text-xs uppercase tracking-wider flex items-center gap-1"><i data-lucide="shield-check" class="w-3 h-3"></i> ADMIN</button>
            </nav>

            <button class="lg:hidden text-brand-navy hover:text-brand-gold transition" onclick="toggleMobileMenu()">
                <i data-lucide="menu" class="w-7 h-7"></i>
            </button>
        </div>

        <div id="mobile-menu" class="hidden lg:hidden bg-white border-b border-slate-200 shadow-lg absolute w-full left-0 top-20">
            <nav class="flex flex-col p-4 space-y-4 text-sm font-medium text-slate-600">
                <button onclick="showSection('home'); toggleMobileMenu()" class="text-left px-4 py-2 hover:bg-slate-50 rounded">Home</button>
                <button onclick="showSection('about'); toggleMobileMenu()" class="text-left px-4 py-2 hover:bg-slate-50 rounded">Overview</button>
                <button onclick="showSection('program'); toggleMobileMenu()" class="text-left px-4 py-2 hover:bg-slate-50 rounded">Program</button>
                <button onclick="showSection('submission'); toggleMobileMenu()" class="text-left px-4 py-2 hover:bg-slate-50 rounded">Submission</button>
                <button onclick="showSection('venue'); toggleMobileMenu()" class="text-left px-4 py-2 hover:bg-slate-50 rounded">Venue</button>
                <button onclick="showSection('accommodation'); toggleMobileMenu()" class="text-left px-4 py-2 hover:bg-slate-50 rounded">Accommodation</button>
                <button onclick="showSection('admin'); toggleMobileMenu(); loadAdminData()" id="mobile-admin-btn" class="hidden text-left px-4 py-2 bg-red-50 text-red-600 font-bold rounded">ADMIN DASHBOARD</button>
            </nav>
        </div>
    </header>

    <div id="home" class="page-section active">
        <section class="hero-bg h-[700px] flex items-center justify-center text-center text-white px-4">
            <div class="max-w-5xl mx-auto space-y-8 animate-[fadeIn_0.8s_ease-out]">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-brand-gold/50 bg-brand-navy/50 backdrop-blur-sm">
                    <span class="w-2 h-2 rounded-full bg-brand-gold animate-pulse"></span>
                    <span class="text-xs font-medium tracking-wider text-brand-gold
